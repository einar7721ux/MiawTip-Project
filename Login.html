<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MiawTip.co</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Iceland&family=Jersey+10&family=Jersey+20&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <header class="sticky-header">
    <div class="header-content login-header-content">
      <a href="LandingPage.html" class="login-logo">MiawTip.co</a>
      <nav class="login-nav">
        <a href="Login.html" class="login-nav-button">Login</a>
        <a href="Register.html" class="login-nav-link">Daftar</a>
      </nav>
    </div>
    <hr class="login-header-divider">
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">Login</h1>

      <form class="login-form">
        <div class="login-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="login-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <label class="remember-me">
          <input type="checkbox" name="remember">
          <span>ingatkan saya</span>
        </label>

        <button type="button" class="login-submit">MASUK</button>
        <p class="forgot-password">lupa kata sandi?</p>
        <p class="register-prompt">Belum Punya akun? <a href="Register.html">Daftar gratis</a></p>
      </form>
    </section>
  </main>
</body>
</html>
